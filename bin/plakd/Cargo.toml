[package]
name = "plakd"
description = "plakd host server, product library, and operator command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://github.com/N0xMare/plak/tree/main/docs/user-guide"
readme.workspace = true
keywords = ["llm", "agent", "cli", "coding-agent"]
categories = ["command-line-utilities", "development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "bin"
class = "supported"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 64
too-many-arguments-ceiling = 13
large-file-ceiling = 0
reason = "Explicit product dispatch and scenario allowances after removing crate-wide suppression; production files remain below 1500 lines."

[[bin]]
name = "plakd"
path = "src/main.rs"
doc = false

[dependencies]
plakd-wire-types.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
plakous-hosted = { workspace = true, default-features = false }
plakous-recursive-subagents = { workspace = true, features = ["git-cli"] }
plakous-recursive-subagents-store = { workspace = true, features = ["git-cli"] }
plakous-host-protocol.workspace = true
# `test-support` only. The optional edge is what keeps the deterministic offline
# model out of every build that does not explicitly ask for it.
plakous-offline-crash-harness = { path = "../../tests/harnesses/offline-crash", optional = true }
tracing-subscriber.workspace = true
plakous = { workspace = true, features = [
    "anthropic", "claude", "codex", "composition", "composition-python",
    "gateway", "grok", "mcp", "openai", "openrouter", "sessions-sqlite",
    "web-fetch", "xai",
] }
nix = { workspace = true, features = ["signal"] }
rusqlite = { workspace = true, features = ["backup", "hooks"] }
rustix = { workspace = true, features = ["event", "fs", "net", "process", "stdio", "system", "termios", "time"] }
base64 = { workspace = true }
url.workspace = true
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
shell-words = "1.1"
zeroize.workspace = true
tempfile = { workspace = true }
time = { version = "0.3", features = ["formatting", "parsing"] }
# Usage and credential refresh times resolve each stamp in the process zone.
jiff = { version = "0.2.35", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
# Configuration is real TOML: `toml` loads the typed schema with spans for
# diagnostics, `toml_edit` makes a single-key save keep the file's comments.
toml.workspace = true
toml_edit.workspace = true
unicode-width = "0.2.2"
uuid = { workspace = true, features = ["v4", "v7"] }
# `plakd wire schema`: the extension's half of the wire v2 schema.
schemars.workspace = true
# `web` only. Serve terminates TLS, so no TLS stack: the WebSocket protocol
# alone, over hyper's upgraded HTTP/1.1 connection.
bytes = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["sink", "std"], optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, features = ["http1", "server"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
ring = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
plakous = { workspace = true, features = ["test-support"] }
rustix = { workspace = true, features = ["pty", "termios", "net"] }
plakous-hosted = { workspace = true, default-features = false, features = ["test-support"] }
plakous-offline-crash-harness = { path = "../../tests/harnesses/offline-crash" }
plakous-recursive-subagents = { workspace = true, features = ["test-support"] }
portable-pty.workspace = true
proptest = { workspace = true, features = ["std"] }
rusqlite.workspace = true
tempfile = { workspace = true }
tungstenite.workspace = true

# No benchmark harness dependency in the workspace: the bench is a plain
# `main` over `std::time::Instant` (named benchmark).
[[bench]]
name = "product_store"
harness = false
required-features = ["test-support"]

[features]
default = ["web"]
jj = ["plakous-hosted/jj-lib", "plakous-recursive-subagents/jj-lib", "plakous-recursive-subagents-store/jj-lib"]
maintainer = ["jj", "web"]
# The supported web endpoint (`plakd host --web`): HTTP/1.1 and WebSocket on a
# private listener, the web UI's static files.
web = [
    "dep:bytes",
    "dep:futures-util",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:ring",
    "dep:tokio-tungstenite",
]
# Repository gate only: isolated product fixtures and the offline model named
# by `PLAK_TEST_SCRIPT`. Never in `default` or the published manifest.
test-support = [
    "plakous/test-support",
    "dep:plakous-offline-crash-harness",
    "plakous-hosted/test-support",
    "plakous-recursive-subagents-store/test-support",
]

[lints]
workspace = true
