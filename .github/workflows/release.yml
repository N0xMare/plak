# Release workflow. A pushed v* tag gates on fmt, policy, cargo-deny, clippy,
# and offline nextest before building the two release tarballs and wire schemas,
# attesting them, and creating the GitHub Release. A manual workflow_dispatch
# run exercises the same gate + build/packaging dry run without publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt
      - name: Pinned verification tools
        run: |
          set -euo pipefail
          pins=tools/gate/dev-tools.pins
          dev_tools=.dev-tools/bin
          mkdir -p "$dev_tools"
          for name in cargo-nextest cargo-deny ruff jj; do
            line="$(awk -v tool="$name" -v target="x86_64-unknown-linux-musl" \
              '$1 == tool && $3 == target { line = $2 " " $4 " " $5 } END { print line }' "$pins")"
            read -r version checksum url <<<"$line"
            tmp="$(mktemp -d)"
            curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$tmp/a.tar.gz"
            printf '%s  %s\n' "$checksum" "$tmp/a.tar.gz" | sha256sum --check --status
            member="$(tar -tzf "$tmp/a.tar.gz" | awk -v name="$name" '{ n = split($0, part, "/") } !found && part[n] == name { print; found = 1 }')"
            tar -xzf "$tmp/a.tar.gz" -C "$tmp" "$member"
            install -m 0755 "$tmp/$member" "$dev_tools/$name"
            rm -rf "$tmp"
          done
          echo "$PWD/.dev-tools/bin" >> "$GITHUB_PATH"
      - name: Static checks, policy, deny and clippy
        run: |
          cargo fmt --all --check
          ruff check tools tests/tooling tests/live eval
          python3 tools/gate/check_workspace.py
          tools/gate/dev-tools.sh deny
          cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      - name: Offline test suite
        run: tools/gate/dev-check.sh --steps tests-parallel

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-musl
          - os: macos-15
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.triple }}
      - name: musl C compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tools/release/package-release.sh --tag "$TAG" --out dist
          else
            tools/release/package-release.sh --untagged --out dist
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/plakd-*.tar.gz
            dist/plakd-*-wire-schema.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.triple }}
          path: |
            dist/plakd-*.tar.gz
            dist/plakd-*-wire-schema.json
          if-no-files-found: error

  release:
    needs: [check, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum plakd-*.tar.gz plakd-*-wire-schema.json > SHA256SUMS
          cat SHA256SUMS
          prerelease=()
          case "$TAG" in *-rc.*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" plakd-*.tar.gz plakd-*-wire-schema.json SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag "${prerelease[@]}"
