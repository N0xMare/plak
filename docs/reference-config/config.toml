# Plak product config (non-secret)
#
# Every key the parser accepts, with its type, default and constraint.
# This is TOML. Deleting a key restores its default; an unknown key or
# section, a duplicate key, a wrong type and malformed syntax are all
# named load errors, never a silent skip.

# The template new sessions bind at genesis.
[root]

# Root-only composition override for the exact root account/model tuple, validated against its account/model. Changing root.agent or applying a profile clears it. Children keep their own template composition. py-sdk uses the typed Python SDK and is not valid in child templates.
# type: enum · default: (unset) · direct|plakous-default|native-ptc|js-ptc|py-ptc|py-sdk
# composition = "py-sdk"

# Template a new session binds at genesis; unset leaves the tuple to the CLI flags or the shell binding.
# type: string · default: (unset) · names an agents/<name>.toml file; [a-z][a-z0-9-]{0,31}, and never a section name
agent = "root-agent"

# The templates spawnable this epoch.
[roster]

# Templates the root may spawn this epoch; every other node spawns from its own template's spawns list.
# type: array of string · default: [] · 0..=5 names, no duplicates, each a template file with a description
working_set = ["worker", "reviewer", "researcher"]

# Tree shape and spawn authority.
[orchestration]

# Whether the topology tools are compiled into the root catalog at all.
# type: bool · default: true · true or false
subagents = true

# Deepest node the tree admits, counting the root as depth 0.
# type: integer · default: 1 · 1..=4
max_depth = 1

# Active or undelivered direct children; dormant children release slots.
# type: integer · default: 8 · 1..=64
max_children = 8

# Root plus active, undelivered or recovery-required nodes.
# type: integer · default: 32 · 1..=65
max_nodes = 32

# Idle seconds before lossless dormant-checkout reclamation.
# type: integer · default: 600 · 1..=65535
workspace_idle_seconds = 600

# Soft fork-checkout disk budget in MiB; retains uncovered work.
# type: integer · default: 4096 · 1..=65535
workspace_budget_mib = 4096

# Days before a sealed dormant child conversation is retired.
# type: integer · default: 7 · 1..=65535
child_retention_days = 7

# Dormant conversations retained; protected work refs never expire.
# type: integer · default: 128 · 1..=65535
child_retention_count = 128

# Attempts one root prompt may open across the tree.
# type: integer · default: 64 · 1..=256
max_attempts = 64

# New continuation turns after transient failure per root user prompt or child attempt; 0 disables automatic continuation.
# type: integer · default: 1 · 0..=2
transient_resumes = 1

# Model requests one account may have in flight across the root and every descendant; excess requests wait in order for a slot. Takes effect on the next launch.
# type: integer · default: 8 · 1..=64
max_concurrent_requests_per_account = 8

# When true, adopt_candidate refuses unless its evidence names a subtree attempt that referenced the candidate.
# type: bool · default: false · true or false
require_review_evidence = false

# How long one root turn may run; there is no wall clock.
[turn]

# Wake an idle interactive root when background processes finish or child results or questions arrive. Takes effect immediately; JSONL and children do not auto-continue.
# type: bool · default: true · true or false
auto_continue = true

# Model rounds one root turn may run; the next round must answer without tools. A turn has no wall clock, so this is what stops a runaway turn. Takes effect when a session next attaches; a running turn keeps the cap it was admitted under.
# type: integer · default: 512 · 1..=1024
max_model_rounds = 512

# Session-owned process budgets and hard runtime caps.
[jobs]

# Default process foreground budget before promotion. Bound at session construction and rebind; exact reopen keeps the stored value.
# type: integer · default: 30 · 1..=600
foreground_seconds = 30

# Hard runtime cap per background process. Bound at session construction and rebind; exact reopen keeps the stored value.
# type: integer · default: 10 · 1..=24
max_runtime_hours = 10

# Direct API-key routes: the input window new sessions are admitted under.
[api]

# Admit direct API sessions (openai, anthropic, xai-api) under the model's full input window instead of the provider's price threshold. Bound at session construction and rebind; exact reopen keeps the stored value.
# type: bool · default: false · true or false
full_window = false

# Automatic transcript compaction.
[compaction]

# Automatic transcript compaction when a session approaches its context bound.
# type: bool · default: true
enabled = true

# Home-wide runtime retention bounds; read at host startup.
[runtime_store]

# Whole runtime-store session cap; includes children and archived sessions. Serving hosts read these limits at startup.
# type: integer · default: 1024 · greater than 0, representable by the SQLite and platform integer ranges; home-scoped
max_sessions = 1024

# Whole runtime-store cap; checkpoints, not disk usage. Serving hosts read these limits at startup.
# type: integer · default: 524288 · at least 16, representable by the SQLite and platform integer ranges; home-scoped
max_checkpoints = 524288

# Whole runtime-store cap; objects, not disk usage. Serving hosts read these limits at startup.
# type: integer · default: 4194304 · at least 16, representable by the SQLite and platform integer ranges; home-scoped
max_objects = 4194304

# Whole runtime-store cap; accounted object payload and edge bytes, not disk usage. Serving hosts read these limits at startup.
# type: integer · default: 4294967296 · at least 16, representable by the SQLite and platform integer ranges; home-scoped
max_object_bytes = 4294967296

# Retire settled child runtimes after their result is consumed. Serving hosts read this at startup.
# type: bool · default: false · true or false; home-scoped
retire_finished_children = false

# Require a verified archive receipt for the exact child revision before retirement. Serving hosts read this at startup.
# type: bool · default: false · true or false; home-scoped
retire_requires_archive_receipt = false

# Agent Skills under .agents/skills and ~/.agents/skills.
[skills]

# Discover Agent Skills (<workspace>/.agents/skills, then ~/.agents/skills; both on the selected runner for a remote session, using that runner process's home, never the host's) when a session is constructed, list them in its instructions, let its read tool read files under that user skill root on the same machine, and give Claude-vocabulary sessions the Skill tool. Bound when a new session or spawn is constructed; exact reopen keeps the listing and tools it froze, and a fork, rebind or switch keeps the source session's on or off.
# type: bool · default: true · true or false
enabled = true

# Local analytics store bounds; nothing leaves the machine.
[telemetry]

# Best-effort byte retention target for the main database, WAL and SHM; busy readers or unfinished sessions may keep it above target.
# type: integer · default: 536870912 · greater than 0; zero is refused as ambiguous. 536870912 is 512 MiB
max_bytes = 536870912

# Retention cutoff for local analytics rows, in days.
# type: integer · default: 90 · greater than 0; zero is refused as ambiguous
max_age_days = 90

# The MCP client; servers are [mcp_servers.<id>] tables.
[mcp]

# The OAuth Client ID Metadata Document that identifies Plak to an MCP authorization server that supports one (spec 01 §8.5). Unset disables that registration path; the document lists the redirect URI http://127.0.0.1/callback, which a server matches on any port. Takes effect at the next plakd mcp login.
# type: string · default: (unset) · https:// URL with a path, no query or fragment; home-scoped
# client_id_metadata_url = "https://plak.example/oauth/client.json"

# The per-user host: how it treats work a lost host left.
[host]

# Permit this user's own processes to request a hosted-session reload (plakd session reload <session> --expect-binary <id>). The serving host records the outcome and names the explicit host upgrade workflow; replacing a client does not upgrade its sessions.
# type: bool · default: false · true or false; home-scoped
reload_requests = false

# Whether the root and sub-agents that lost their owner (a crash or a proven lease loss) hold for the operator's Resume or continue once by themselves with a new instruction turn, the root's restored queue draining too (chapter 03 §14.1). A loss that interrupted a continuation itself holds under either policy. Read when the root attaches and opens, and by plakd host's start scan, which opens eligible held roots under continue.
# type: enum · default: (unset) · hold|continue; unset holds; home-scoped
# resume_after_loss = "continue"

# The maintainer web endpoint (plakd host --web): who it admits and where it is served.
# [web]

# The tailnet logins (Tailscale-User-Login) plakd host --web admits through tailscale serve. Read when plakd host starts with --web.
# type: array of string · default: (unset) · tailnet logins, no duplicates; unset admits no one; home-scoped
# allow = ["you@example.com"]

# The exact origin tailscale serve publishes plakd host --web at; every request must name its host and a WebSocket upgrade its origin. Read when plakd host starts with --web.
# type: string · default: (unset) · https://<host>[:port], nothing after it; home-scoped
# origin = "https://host.example.ts.net"

# Allow admitted web principals to read home account status and usage. Same-user sockets are trusted independently. Captured at host startup; restart to change it.
# type: bool · default: false · true or false; home-scoped; host restart required
# accounts_read = false

# Allow confirmed operator credential mutations. Requires accounts_read; home-only, default off and captured at host startup. Credentials replace this user's machine-wide selected account, not the browser's credentials.
# type: bool · default: false · true or false; home-scoped; host restart required
# credentials_write = false

# Allow admitted web principals to read home profiles, templates and allowlisted configuration. Same-user sockets are trusted independently. Captured at host startup; restart to change it.
# type: bool · default: false · true or false; home-scoped; host restart required
# config_read = false

# Allow confirmed allowlisted home configuration, template and profile writes. Grants deferred execution through tools, on_mint and env. Requires config_read; home-only, default off and captured at host startup.
# type: bool · default: false · true or false; home-scoped; host restart required
# config_write = false

# Allow admitted web principals to inspect saved workspaces and Changes. Exact file bytes may contain secrets. Same-user sockets are trusted independently; default off and captured at host startup.
# type: bool · default: false · true or false; home-scoped; host restart required
# files_read = false

# Allow confirmed interactive operator shells as the runner user. Shells are not confined to the workspace. Same-user sockets are trusted independently; default off and captured at host startup.
# type: bool · default: false · true or false; home-scoped; host restart required
# terminal = false

# The separate credential gateway. Required for hosts; standalone account commands can use the local service.
# [gateway]

# Where the host sends account and relay calls. plakd host install sets the default Unix socket. Standalone account administration without host configuration targets the local gateway service; neither mode opens credentials in-process.
# type: string · default: (unset) · Required for hosts; unix:<absolute path> or tcp:<ip>:<port>; loopback, tailnet or allow_non_tailnet; home-scoped; host restart required
# address = "unix:/run/user/1000/plak/gateway.sock"

# The caller key file for a configured gateway address. A tcp address defaults to the home secrets gateway.key; a unix address sends a key only when this is set, and a same-UID unix peer without one is the local administrator. Captured at host startup.
# type: string · default: (unset) · absolute path; single-link regular file owned by euid, mode 0600 (no symlink/hardlink, max 16 KiB); home-scoped; host restart required
# key_file = "/home/user/.plak/secrets/gateway.key"

# Admit a tcp gateway address outside loopback and the tailnet ranges. Default false. Captured at host startup.
# type: bool · default: false · true or false; home-scoped; host restart required
# allow_non_tailnet = false

# Optional-tool options. A table enables nothing: a template enables a tool by
# listing it in tools = [...]. A trusted project may add or replace entries by
# name. Secrets are never values here; name one stored with `plakd secret set`.
#
# [tools.fetch_url]
# max_bytes = 2097152                 # 1..=8388608, body cap before conversion
# timeout_seconds = 30                # 1..=120, whole fetch with redirects
#
# [tools.web_search]
# max_uses = 5                        # 1..=20 searches per call
# allowed_domains = []                # at most 10; exclusive with blocked_domains
# blocked_domains = []                # at most 10
#
# [tools.x_search]
# allowed_x_handles = []              # at most 20 handles, without the @
#
# [mcp_servers.github]
# transport = "stdio"
# command = "github-mcp-server"       # resolved on PATH at spawn
# args = ["stdio"]
# env = { GITHUB_TOOLSETS = "repos,issues" }
# secret_env = { GITHUB_PERSONAL_ACCESS_TOKEN = "github" }
# tools = ["get_file_contents", "create_issue"]   # omit for every listed tool
# startup_seconds = 20                # 1..=120
# call_seconds = 120                  # 1..=3600 per call
#
# [mcp_servers.linear]
# transport = "http"
# url = "https://mcp.linear.app/mcp"  # https, or http to 127.0.0.1 or [::1]
# bearer_secret = "linear"            # Authorization: Bearer <secret>
# headers = { X-Client = "plakd" }
# secret_headers = { X-Workspace = "linear-ws" }
