# Reviewed vendor snapshot. See PROVENANCE.md for the exact upstream identity
# and the files copied. This package is excluded from workspace membership and
# is compiled by Cargo as an ordinary path dependency, so it neither inherits
# nor is bound by the workspace lints.
[package]
name = "plakous-codex-code-mode-protocol"
description = "Reviewed vendor snapshot of the pinned Codex Code Mode description and schema rendering, packaged for Plakous"
version = "0.153.3"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/openai/codex"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
