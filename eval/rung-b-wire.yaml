# Terminal-Bench 4.0. Scores are not comparable to 2.x / 3.0.
# Dataset slug: terminal-bench/terminal-bench@4.0.0
# Rung B wire: run one TB 4.0 task via --include-task-name (n_concurrent_trials: 1).
jobs_dir: .plak/harbor/jobs
n_attempts: 1
n_concurrent_trials: 1

agents:
  - import_path: harbor_adapter.agent:PlakAgent
    model_name: gpt-5.6-luna
    kwargs:
      # No binary_path/js_host_path here: the artifact root is per-architecture
      # (.plak/installed/<arch>/) and the adapter resolves it from HARBOR_ARCH.
      account: codex
      model: gpt-5.6-luna
      effort: low

environment:
  type: docker

datasets:
  - name: terminal-bench/terminal-bench
    ref: "4.0.0"
