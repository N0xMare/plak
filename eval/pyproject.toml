[project]
name = "plak-harbor-adapter"
version = "0.1.0"
description = "Harbor integration for Plak"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_adapter"]

[tool.hatch.build.targets.wheel.force-include]
"harbor_adapter/rate_card.json" = "harbor_adapter/rate_card.json"
