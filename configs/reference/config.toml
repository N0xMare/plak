# Plak product config (non-secret)
#
# Every key the parser accepts, with its type, default and constraint.
# This is TOML. Deleting a key restores its default; an unknown key or
# section, a duplicate key, a wrong type and malformed syntax are all
# named load errors, never a silent skip.

# The template new sessions bind at genesis.
[root]

# Template a new session binds at genesis; unset leaves the tuple to the CLI flags or the shell binding.
# type: string · default: (unset) · names an agents/<name>.toml file; [a-z][a-z0-9-]{0,31}, and never a section name
agent = "root-agent"

# The templates spawnable this epoch.
[roster]

# Templates the root may spawn this epoch; every other node spawns from its own template's spawns list.
# type: array of string · default: [] · 0..=5 names, no duplicates, each a template file with a description
working_set = ["worker", "reviewer", "scout"]

# Tree shape and spawn authority.
[orchestration]

# Whether the topology tools are compiled into the root catalog at all.
# type: bool · default: true · true or false
subagents = true

# Deepest node the tree admits, counting the root as depth 0.
# type: integer · default: 1 · 1..=4
max_depth = 1

# Active or undelivered direct children; dormant children release slots.
# type: integer · default: 8 · 1..=8
max_children = 8

# Root plus active, undelivered or recovery-required nodes.
# type: integer · default: 32 · 1..=32
max_nodes = 32

# Idle seconds before lossless dormant-checkout reclamation.
# type: integer · default: 600 · 1..=65535
workspace_idle_seconds = 600

# Soft fork-checkout disk budget in MiB; retains uncovered work.
# type: integer · default: 4096 · 1..=65535
workspace_budget_mib = 4096

# Days before a sealed dormant child conversation is retired.
# type: integer · default: 7 · 1..=65535
child_retention_days = 7

# Dormant conversations retained; protected work refs never expire.
# type: integer · default: 128 · 1..=65535
child_retention_count = 128

# Attempts one root prompt may open across the tree.
# type: integer · default: 64 · 1..=64
max_attempts = 64

# New continuation turns after transient failure per root user prompt or child attempt; 0 disables automatic continuation.
# type: integer · default: 1 · 0..=2
transient_resumes = 1

# When true, adopt_candidate refuses unless its evidence names a subtree attempt that referenced the candidate.
# type: bool · default: false · true or false
require_review_evidence = false

# How long one root turn may run; there is no wall clock.
[turn]

# Wake an idle interactive root when background processes finish or child results or questions arrive. Takes effect immediately; JSONL and children do not auto-continue.
# type: bool · default: true · true or false
auto_continue = true

# Model rounds one root turn may run; the next round must answer without tools. A turn has no wall clock, so this is what stops a runaway turn. Takes effect when a session next attaches; a running turn keeps the cap it was admitted under.
# type: integer · default: 512 · 1..=1024
max_model_rounds = 512

# Session-owned process budgets and hard runtime caps.
[jobs]

# Default process foreground budget before promotion. Bound at session construction and rebind; exact reopen keeps the stored value.
# type: integer · default: 30 · 1..=600
foreground_seconds = 30

# Hard runtime cap per background process. Bound at session construction and rebind; exact reopen keeps the stored value.
# type: integer · default: 10 · 1..=24
max_runtime_hours = 10

# Direct API-key routes: the input window new sessions are admitted under.
[api]

# Admit direct API sessions (openai, anthropic, xai-api) under the model's full input window instead of the provider's price threshold. Bound at session construction and rebind; exact reopen keeps the stored value.
# type: bool · default: false · true or false
full_window = false

# Terminal-app preferences; nothing here reaches a provider.
[tui]

# Mouse capture; turning it off hands text selection back to the terminal. Takes effect on the next launch.
# type: bool · default: true
mouse = true

# Color palette for the whole product shell.
# type: enum · default: "default-dark" · default-dark|default-light|catppuccin-latte|catppuccin-frappe|catppuccin-macchiato|catppuccin-mocha; dark and light are accepted aliases that normalize on the next save
theme = "default-dark"

# Transcript lines moved per wheel tick.
# type: integer · default: 3 · 1..=10
scroll_lines = 3

# Render reasoning blocks where the provider admits them.
# type: bool · default: true · subject to the provider's reasoning policy
show_thinking = true

# Collapse consecutive tool activities to a summary when assistant prose resumes; false keeps action lines visible.
# type: bool · default: true
group_tool_calls = true

# Suppress the spinner, the pulse and camera easing.
# type: bool · default: false
reduced_motion = false

# Automatic transcript compaction.
[compaction]

# Automatic transcript compaction when a session approaches its context bound.
# type: bool · default: true
enabled = true

# Local analytics store bounds; nothing leaves the machine.
[telemetry]

# Best-effort byte retention target for the main database, WAL and SHM; busy readers or unfinished sessions may keep it above target.
# type: integer · default: 536870912 · greater than 0; zero is refused as ambiguous. 536870912 is 512 MiB
max_bytes = 536870912

# Retention cutoff for local analytics rows, in days.
# type: integer · default: 90 · greater than 0; zero is refused as ambiguous
max_age_days = 90
