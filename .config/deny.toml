[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "Chrono 0.4.45 is unmaintained; maintenance advisory, not a known vulnerability. Reached only through jj-lib, rmcp and schemars, which offer no upgrade path. Revisit when any of them moves off chrono." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "rsa" },
    { name = "rquickjs", wrappers = ["plakous-js-runtime"] },
    { name = "rquickjs-core", wrappers = ["rquickjs"] },
    { name = "rquickjs-sys", wrappers = ["rquickjs-core"] },
    { name = "micro-monty", wrappers = ["plakous-py-worker"] },
    { name = "ratatui" },
    { name = "crossterm" },
    { name = "pulldown-cmark" },
    { name = "syntect" },
    { name = "arboard" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # MPL-2.0 stays allowed for reviewed transitive dependencies; no direct dependency uses it.
    "MPL-2.0",
    "PSF-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git sources: the pinned Codex 0.153.3 Code Mode grammar is the reviewed
# vendor snapshot at `vendor/codex-code-mode-protocol`.
allow-git = []
