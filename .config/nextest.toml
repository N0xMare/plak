# nextest profiles for Plak / Plakous
#
# `just steps tests-parallel,tests-serial,tests-durability` runs the offline, serial and durability profiles in turn:
#   cargo nextest run --locked --workspace --all-features --profile <lane>

[store]
dir = "target/nextest"

# Native subscription auth tests share process-local fixtures; run them
# serially across the workspace. No test binds a pinned callback port.
[test-groups]
native-auth-serial = { max-threads = 1 }
cli-contract-serial = { max-threads = 1 }

# Lanes. `default` runs everything nextest selects (ad-hoc runs); the three
# lane profiles inherit its settings and overrides and partition the suite:
#   offline     parallel lane: everything not in `serial` or `durability`
#   serial      tests whose subject is a wall-clock budget, one at a time
#   durability  crash matrices and the sqlite SIGKILL campaign, one at a time
# A test added to `serial` or `durability` must also be added to the
# exclusion in `offline`; tests/tooling/test_nextest_lanes.py checks that the
# three sets partition the suite and that every predicate names a real test.
# See docs/spec/05-testing-and-evidence.md section 2.3.

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
# Give a departed test five seconds for captured output EOF to be observed.
# If EOF is still unobserved, fail rather than pass with a LEAK annotation. A
# one-second window false-failed in-process tests whenever the runner itself
# stalled for a second under gate load; a real leaked descendant holds the pipe
# far longer than five.
leak-timeout = { period = "5s", result = "fail" }

# macOS creates pipes without an atomic close-on-exec flag, so a test process
# spawned concurrently can briefly inherit another test's output pipe and
# hold it past exit. A leak there names a random passing test, never a leak of
# the test itself; Linux, whose pipes are atomic, keeps leaks fatal.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'all()'
leak-timeout = { period = "1s", result = "pass" }

[[profile.default.overrides]]
filter = 'test(native_auth::)'
test-group = 'native-auth-serial'

[[profile.default.overrides]]
filter = 'package(=plak) & binary(=integration) & test(/^cli_contract::/)'
test-group = 'cli-contract-serial'

[[profile.default.overrides]]
filter = 'binary(local_transport)'
test-group = 'native-auth-serial'

# Each store's long-turn fixture executes real nested calls.
[[profile.default.overrides]]
filter = 'test(ledger_retirement_5000_real_leaf_calls_in_closed_cells_memory) | test(ledger_retirement_5000_real_leaf_calls_in_closed_cells_sqlite)'
slow-timeout = { period = "60s", terminate-after = 60 }

[[profile.default.overrides]]
filter = '''
test(ledger_retirement_5000_direct_batch_calls)
| test(crash_sweep::durability_ledger_retirement_closed_cells)
| test(crash_sweep::durability_ledger_retirement_live_child_process)
| test(crash_sweep::durability_ledger_retirement_yielded_cell)
| test(crash_sweep::durability_ledger_retirement_interrupted_batch)
| test(crash_sweep::durability_ledger_retirement_pilots)
| test(crash_sweep::durability_ledger_retirement_early_relaunches)
'''
slow-timeout = { period = "60s", terminate-after = 60 }

# Opt-in (ignored) pruning sweep-cost measurement over a large store.
[[profile.default.overrides]]
filter = 'test(sqlite_prune_sweep_cost_on_a_large_store)'
slow-timeout = { period = "300s", terminate-after = 2 }

# Opt-in (ignored) TLS write-path reproducer matrix.
[[profile.default.overrides]]
filter = 'test(tls_integrity_reproducer_matrix)'
slow-timeout = { period = "300s", terminate-after = 2 }

# One scripted turn long enough that a Working prune has run, held before
# its terminal. Sqlite commits make it slower than the agent-store twin.
[[profile.default.overrides]]
filter = 'test(a_reader_within_the_recency_margin_projects_exactly_across_an_in_turn_compaction)'
slow-timeout = { period = "240s", terminate-after = 2 }

# The stop-cut matrix crashes a running turn and reopens it. The holder is
# this same process, so the store cannot prove it gone and the branch stays
# leased until the production lease expires. The waits sit inside one test.
[[profile.default.overrides]]
filter = 'test(a_stop_cut_with_children_decides_the_root_and_the_wake)'
slow-timeout = { period = "300s", terminate-after = 2 }

