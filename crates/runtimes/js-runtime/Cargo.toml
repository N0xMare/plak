[package]
name = "plakous-js-runtime"
description = "QuickJS worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-js-runtime"
readme = "README.md"
keywords = ["llm", "agent", "javascript", "sandbox"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "engine"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 1
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[features]
test-hooks = []

[[bin]]
name = "plakous-js-host"
path = "src/bin/plakous-js-host.rs"

[dependencies]
plakous-cell.workspace = true
rquickjs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "process", "io-util"] }

[dev-dependencies]
nix = { workspace = true, features = ["process", "resource", "signal"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
