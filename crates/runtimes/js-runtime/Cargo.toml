[package]
name = "plakous-js-runtime"
description = "QuickJS worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "engine"
class = "published-internal"

[[bin]]
name = "plakous-js-host"
path = "src/bin/plakous-js-host.rs"

[dependencies]
plakous-js-eval.workspace = true
rquickjs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "process", "io-util"] }

[dev-dependencies]
nix = { workspace = true, features = ["process", "resource", "signal"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
