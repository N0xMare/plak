[package]
name = "plakous-py-worker"
description = "Plak Python cell worker: the micro-monty interpreter on the cell protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://github.com/N0xMare/plak/blob/main/docs/spec/06-build-and-support-surface.md"
readme = "README.md"
keywords = ["llm", "agent", "python", "sandbox"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "engine"
class = "published-internal"

[[bin]]
name = "plakous-py-host"
path = "src/main.rs"

[features]
test-hooks = []

[dependencies]
cap = "0.1.2"
micro-monty = "=0.0.2"
plakous-cell.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
