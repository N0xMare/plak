[package]
name = "plakous-py-worker"
description = "Plak Monty subprocess worker using the pinned upstream interpreter and protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "engine"
class = "published-internal"

[[bin]]
name = "monty"
path = "src/main.rs"

[dependencies]
monty-proto = { version = "=1.1.0", features = ["worker"] }
monty-alloc = { version = "=1.1.0", features = ["exit-code"] }
monty-types = "=1.1.0"

[lints]
workspace = true
