[package]
name = "plakous-py-worker"
description = "Plak Python cell worker: the pinned upstream Monty interpreter on the cell protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/N0xMare/plak/blob/main/docs/spec/06-build-and-support-surface.md"
readme = "README.md"
keywords = ["llm", "agent", "python", "sandbox"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "engine"
class = "published-internal"

[[bin]]
name = "plakous-py-host"
path = "src/main.rs"

[features]
test-hooks = []

[dependencies]
monty-proto = { version = "=1.2.0", features = ["worker"] }
monty-alloc = { version = "=1.2.0", features = ["exit-code"] }
monty-types = "=1.2.0"
plakous-cell.workspace = true
serde_json.workspace = true

[dev-dependencies]
num-bigint = "0.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
