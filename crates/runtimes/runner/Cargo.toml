[package]
name = "plakous-runner"
description = "The host and runner ends of the Plakous runner protocol over an execution environment, with an in-process loopback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-runner"
readme = "README.md"
keywords = ["llm", "agent", "remote"]
categories = ["development-tools", "network-programming"]
exclude.workspace = true

[package.metadata.plakous]
layer = "engine"
class = "published-internal"

[dependencies]
plakous-model.workspace = true
plakous-runner-protocol.workspace = true
plakous-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
