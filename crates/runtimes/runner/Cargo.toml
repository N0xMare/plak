[package]
name = "plakous-runner"
description = "The loopback runner: the host and runner ends of the runner protocol over a Plakous execution environment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[package.metadata.plakous]
layer = "engine"
class = "repository-only"

[dependencies]
plakous-model.workspace = true
plakous-runner-protocol = { path = "../../common/runner-protocol" }
plakous-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
