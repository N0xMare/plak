[package]
name = "plakous-recursive-subagents"
description = "One durable agent tree per root session: nodes, grants, attempts, candidates, mail, epochs, and the nine topology tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-recursive-subagents"
readme = "README.md"
keywords = ["llm", "agent", "subagents"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "host"
class = "published-internal"
neutral = true

[dependencies]
futures-util = { workspace = true, features = ["std"] }
plakous.workspace = true
plakous-host-protocol.workspace = true
plakous-workspace.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
plakous-offline-crash-harness = { path = "../../../tests/harnesses/offline-crash" }
plakous-workspace = { workspace = true, features = ["test-support"] }
proptest = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true, features = ["v4"] }

[features]
default = ["git-cli", "jj-lib"]
git-cli = ["plakous-workspace/git-cli"]
jj-lib = ["plakous-workspace/jj-lib"]
# `MemoryTreeStore`, `FakeVcs`, and the fixtures the crates above this one drive.
test-support = [
    "dep:tempfile",
    "dep:uuid",
    "plakous-host-protocol/test-support",
    "plakous-workspace/test-support",
]

[lints]
workspace = true
