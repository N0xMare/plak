[package]
name = "plakous-recursive-subagents-store"
description = "The agent tree's durable store: TreeStore over its own subagents.sqlite3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-recursive-subagents-store"
readme = "README.md"
keywords = ["llm", "agent", "subagents", "sqlite"]
categories = ["database"]
exclude.workspace = true

[package.metadata.plakous]
layer = "host"
class = "published-internal"
neutral = true

[dependencies]
# Repository-only commit tracing; never selected by a default or maintainer build.
plakous-store = { workspace = true, optional = true }
plakous-recursive-subagents.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
plakous.workspace = true
plakous-workspace.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = ["git-cli", "jj-lib"]
git-cli = ["plakous-recursive-subagents/git-cli"]
jj-lib = ["plakous-recursive-subagents/jj-lib"]
test-support = ["plakous-recursive-subagents/test-support"]
commit-trace = ["dep:plakous-store", "plakous-store/commit-trace"]

[lints]
workspace = true
