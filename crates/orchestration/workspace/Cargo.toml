[package]
name = "plakous-workspace"
description = "VCS-backed agent workspaces: detect, mint, seal, adopt, and the git-redirect fence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-workspace"
readme = "README.md"
keywords = ["llm", "agent", "git", "jj", "worktree"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "host"
class = "published-internal"
neutral = true

[dependencies]
plakous-host-protocol.workspace = true
rustix = { workspace = true, features = ["process"] }
sha2.workspace = true
jj-lib = { version = "=0.46.0", default-features = false, features = ["git"], optional = true }
futures = { workspace = true, optional = true }
gix = { version = "=0.88.0", default-features = false, optional = true }
pollster = { version = "=1.0.1", optional = true }
tempfile.workspace = true

[features]
default = ["git-cli", "jj-lib"]
git-cli = []
jj-lib = ["dep:jj-lib", "dep:futures", "dep:pollster", "dep:gix"]
# `FakeVcs` and the real-`git`/`jj` fixtures, for the crates above this one.
test-support = []

[lints]
workspace = true
