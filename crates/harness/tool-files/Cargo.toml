[package]
name = "plakous-tool-files"
description = "One workspace-path rule and one patch preflight: bounded reads, exact-content patching, image inspection, and every provider lowering of them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-tool-files"
readme = "README.md"
keywords = ["llm", "agent", "tools", "files"]
categories = ["filesystem", "development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "harness"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 2
large-file-ceiling = 0
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[dependencies]
diffy.workspace = true
plakous-model.workspace = true
plakous-tools.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
