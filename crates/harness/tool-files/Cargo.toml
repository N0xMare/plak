[package]
name = "plakous-tool-files"
description = "One workspace-path rule and one patch preflight: bounded reads, exact-content patching, image inspection, and every provider lowering of them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "harness"
class = "published-internal"

[dependencies]
diffy.workspace = true
plakous-model = { version = "0.1.0", path = "../../core/model" }
plakous-tools = { version = "0.1.0", path = "../../core/tools" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
