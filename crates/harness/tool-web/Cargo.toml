[package]
name = "plakous-tool-web"
description = "Local wrapper tools for provider-hosted web search, page fetch and X search, one isolated side request per call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "harness"
class = "published-internal"

[dependencies]
plakous-model = { version = "0.1.0", path = "../../core/model" }
plakous-tools = { version = "0.1.0", path = "../../core/tools" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
htmd = { version = "0.5.6", optional = true }
plakous-http = { version = "0.1.0", path = "../../common/http", optional = true }
plakous-tool-files = { version = "0.1.0", path = "../tool-files", optional = true }
tokio = { workspace = true, features = ["macros", "sync", "time"], optional = true }
url = { workspace = true, optional = true }

[features]
# The Plak-run `fetch_url` tool: an HTTPS client, HTML-to-markdown
# conversion and the image sniffer. Enabled by every facade feature that
# already links `plakous-http`.
fetch = ["dep:htmd", "dep:plakous-http", "dep:plakous-tool-files", "dep:tokio", "dep:url"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[lints]
workspace = true
