[package]
name = "plakous-mcp"
description = "Model Context Protocol client: a process-wide server pool, frozen tool listings, schema lowering, and the MCP tool pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-mcp"
readme = "README.md"
keywords = ["llm", "agent", "mcp", "tools"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "harness"
class = "published-internal"

[dependencies]
futures-util = { workspace = true, features = ["alloc"] }
http.workspace = true
plakous-auth = { workspace = true, features = ["http-refresh"] }
plakous-http.workspace = true
plakous-model.workspace = true
plakous-tools.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sse-stream = "0.2.5"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "server", "transport-async-rw", "transport-streamable-http-client"] }
tempfile.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
