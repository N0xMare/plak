[package]
name = "plakous-tool-search"
description = "Bounded deterministic repository search and directory listing, with its own walker and bound table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-tool-search"
readme = "README.md"
keywords = ["llm", "agent", "tools", "search"]
categories = ["development-tools", "filesystem"]
exclude.workspace = true

[package.metadata.plakous]
layer = "harness"
class = "published-internal"

[dependencies]
plakous-model.workspace = true
plakous-tools.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
