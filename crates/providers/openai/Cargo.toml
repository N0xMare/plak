[package]
name = "plakous-openai"
description = "OpenAI Responses protocol integration for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-openai"
readme = "README.md"
keywords = ["llm", "agent", "openai", "provider"]
categories = ["api-bindings"]
exclude.workspace = true

[package.metadata.plakous]
layer = "provider"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 9
large-file-ceiling = 2
crate-wide-allows = ["src/lib.rs:too_many_arguments", "src/lib.rs:too_many_lines"]
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[features]
test-clock = []
default = []
native-auth = [
    "dep:base64",
    "dep:jsonwebtoken",
    "dep:plakous-auth",
    "dep:subtle",
    "plakous-auth/http-refresh",
    "plakous-auth/jwt",
    "tokio/io-util",
    "tokio/macros",
    "tokio/net",
]
# Test-only: ephemeral browser-login callbacks and an explicit catalog fixture
# origin. A dev-dependency of `plakous`, never a production edge.
test-support = ["native-auth"]
[dependencies]
base64 = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
plakous-auth = { workspace = true, optional = true }
plakous-exchange.workspace = true
plakous-http.workspace = true
plakous-attempt.workspace = true
plakous-model.workspace = true
plakous-responses.workspace = true
plakous-responses-dialect.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
secrecy.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
ring.workspace = true
plakous-agent.workspace = true
plakous-tools.workspace = true
plakous-http = { workspace = true, features = ["fault-injection"] }
plakous-test-support = { path = "../../../tests/support/plakous-test-support" }
base64.workspace = true
futures-core.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[lints]
workspace = true
