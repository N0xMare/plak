[package]
name = "plakous-anthropic"
description = "Anthropic Messages protocol integration for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-anthropic"
readme = "README.md"
keywords = ["llm", "agent", "anthropic", "claude", "provider"]
categories = ["api-bindings"]
exclude.workspace = true
publish = false

[package.metadata.plakous]
layer = "provider"
class = "published-internal"

[features]
default = []
native-auth = [
    "dep:plakous-auth",
    "dep:thiserror",
    "dep:zeroize",
    "plakous-auth/http-refresh",
]
[dependencies]
plakous-auth = { workspace = true, optional = true }
plakous-attempt.workspace = true
plakous-exchange.workspace = true
plakous-http.workspace = true
plakous-model.workspace = true
plakous-messages.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
secrecy.workspace = true
time = { version = "0.3", features = ["parsing"] }
thiserror = { workspace = true, optional = true }
tower-service.workspace = true
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true, features = ["std"] }
plakous-agent.workspace = true
plakous-http = { workspace = true, features = ["fault-injection"] }
plakous-tools.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
