[package]
name = "plakous-anthropic"
description = "Anthropic Messages protocol integration for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "provider"
class = "published-internal"

[features]
default = []
native-auth = [
    "dep:plakous-auth",
    "dep:thiserror",
    "dep:tokio",
    "dep:zeroize",
    "plakous-auth/http-refresh",
]
[dependencies]
plakous-auth = { version = "0.1.0", path = "../../common/auth", default-features = false, optional = true }
plakous-attempt = { version = "0.1.0", path = "../../common/attempt" }
plakous-exchange = { version = "0.1.0", path = "../../protocols/exchange" }
plakous-http = { version = "0.1.0", path = "../../common/http" }
plakous-model = { version = "0.1.0", path = "../../core/model" }
plakous-messages = { version = "0.1.0", path = "../../protocols/messages" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
secrecy.workspace = true
time = { version = "0.3", features = ["parsing"] }
thiserror = { workspace = true, optional = true }
tower-service.workspace = true
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "time"], optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true, features = ["std"] }
plakous-agent = { version = "0.1.0", path = "../../core/agent" }
plakous-http = { version = "0.1.0", path = "../../common/http", features = ["fault-injection"] }
plakous-tools = { version = "0.1.0", path = "../../core/tools" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
