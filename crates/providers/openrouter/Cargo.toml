[package]
name = "plakous-openrouter"
description = "Dynamic OpenRouter Chat, Responses, and Messages dialects for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "provider"
class = "published-internal"

[dependencies]
plakous-attempt = { version = "0.1.0", path = "../../common/attempt" }
plakous-chat-completions = { version = "0.1.0", path = "../../protocols/chat-completions" }
plakous-exchange = { version = "0.1.0", path = "../../protocols/exchange" }
plakous-http = { version = "0.1.0", path = "../../common/http" }
plakous-model = { version = "0.1.0", path = "../../core/model" }
plakous-messages = { version = "0.1.0", path = "../../protocols/messages" }
plakous-responses = { version = "0.1.0", path = "../../protocols/responses" }
plakous-responses-dialect = { version = "0.1.0", path = "../../protocols/responses-dialect" }
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
secrecy.workspace = true

[dev-dependencies]
futures-util.workspace = true
plakous-agent = { version = "0.1.0", path = "../../core/agent" }
plakous-http = { version = "0.1.0", path = "../../common/http", features = ["fault-injection"] }
plakous-tools = { version = "0.1.0", path = "../../core/tools" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
