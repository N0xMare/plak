[package]
name = "plakous-openrouter"
description = "Dynamic OpenRouter Chat, Responses, and Messages dialects for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "provider"
class = "published-internal"

[dependencies]
plakous-attempt.workspace = true
plakous-chat-completions.workspace = true
plakous-exchange.workspace = true
plakous-http.workspace = true
plakous-model.workspace = true
plakous-messages.workspace = true
plakous-responses.workspace = true
plakous-responses-dialect.workspace = true
futures-util.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
secrecy.workspace = true

[dev-dependencies]
futures-util.workspace = true
plakous-agent.workspace = true
plakous-http = { workspace = true, features = ["fault-injection"] }
plakous-tools.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true
