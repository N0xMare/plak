[package]
name = "plakous-xai"
description = "xAI Responses and Grok subscription protocol integration for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-xai"
readme = "README.md"
keywords = ["llm", "agent", "xai", "grok", "provider"]
categories = ["api-bindings"]
exclude.workspace = true
publish = false

[package.metadata.plakous]
layer = "provider"
class = "published-internal"

[features]
default = []
native-auth = [
    "dep:base64",
    "dep:futures-util",
    "dep:getrandom",
    "dep:jsonwebtoken",
    "dep:plakous-auth",
    "dep:sha2",
    "dep:url",
    "plakous-auth/http-refresh",
    "tokio/io-util",
    "tokio/net",
]
[dependencies]
base64 = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["async-await", "std"], optional = true }
getrandom = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"], optional = true }
plakous-auth = { workspace = true, optional = true }
plakous-exchange.workspace = true
plakous-http.workspace = true
plakous-attempt.workspace = true
plakous-model.workspace = true
plakous-responses.workspace = true
plakous-responses-dialect.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
time = { version = "0.3", features = ["parsing"] }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
plakous-http = { workspace = true, features = ["fault-injection"] }
plakous-test-support = { path = "../../../tests/support/plakous-test-support" }
base64.workspace = true
futures-core.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring"] }

[lints]
workspace = true
