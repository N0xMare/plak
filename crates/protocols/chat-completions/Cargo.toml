[package]
name = "plakous-chat-completions"
description = "Provider-neutral Chat Completions protocol-family kernel for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "protocol"
class = "published-internal"

[dependencies]
base64.workspace = true
futures-channel = { workspace = true, features = ["sink"] }
futures-util = { workspace = true, features = ["sink", "std"] }
plakous-attempt = { version = "0.1.0", path = "../../common/attempt" }
plakous-exchange = { version = "0.1.0", path = "../exchange" }
plakous-http = { version = "0.1.0", path = "../../common/http" }
plakous-model = { version = "0.1.0", path = "../../core/model" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "time"] }
tower-service.workspace = true

[dev-dependencies]
plakous-http = { version = "0.1.0", path = "../../common/http", features = ["fault-injection"] }
futures = { workspace = true, features = ["executor", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
uuid.workspace = true

[lints]
workspace = true
