[package]
name = "plakous-chat-completions"
description = "Provider-neutral Chat Completions protocol-family kernel for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-chat-completions"
readme = "README.md"
keywords = ["llm", "agent", "openai", "chat-completions"]
categories = ["api-bindings", "web-programming::http-client"]
exclude.workspace = true

[package.metadata.plakous]
layer = "protocol"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 5
too-many-arguments-ceiling = 2
large-file-ceiling = 0
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[dependencies]
base64.workspace = true
plakous-attempt.workspace = true
plakous-exchange.workspace = true
plakous-http.workspace = true
plakous-model.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
unicode-general-category.workspace = true

[dev-dependencies]
plakous-http = { workspace = true, features = ["fault-injection"] }
futures = { workspace = true, features = ["executor", "std"] }
futures-util = { workspace = true, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
uuid.workspace = true

[lints]
workspace = true
