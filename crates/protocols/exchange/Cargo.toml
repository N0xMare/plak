[package]
name = "plakous-exchange"
description = "Shared physical-exchange plumbing for Plakous protocol-family kernels and providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-exchange"
readme = "README.md"
keywords = ["llm", "agent", "http"]
categories = ["api-bindings", "web-programming::http-client"]
exclude.workspace = true

[package.metadata.plakous]
layer = "protocol"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 2
too-many-arguments-ceiling = 4
large-file-ceiling = 0
reason = "One physical family host replaces the Chat and Messages copies; phase and stream owners retain their exact authority inputs."

[dependencies]
futures-channel = { workspace = true, features = ["sink"] }
futures-util = { workspace = true, features = ["sink", "std"] }
getrandom.workspace = true
plakous-attempt.workspace = true
plakous-http.workspace = true
plakous-model.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
tower-service.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor", "std"] }
uuid.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
