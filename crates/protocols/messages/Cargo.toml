[package]
name = "plakous-messages"
description = "Messages-family protocol kernel primitives for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "protocol"
class = "published-internal"

[dependencies]
base64.workspace = true
futures-channel = { workspace = true, features = ["sink"] }
futures-util = { workspace = true, features = ["sink", "std"] }
plakous-attempt = { version = "0.1.0", path = "../../common/attempt" }
plakous-exchange = { version = "0.1.0", path = "../exchange" }
plakous-http = { version = "0.1.0", path = "../../common/http" }
plakous-model = { version = "0.1.0", path = "../../core/model" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tower-service.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor", "std"] }
tokio = { workspace = true, features = ["io-util", "net", "rt", "test-util"] }
uuid.workspace = true

[lints]
workspace = true
