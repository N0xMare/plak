[package]
name = "plakous-messages"
description = "Messages-family protocol kernel primitives for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-messages"
readme = "README.md"
keywords = ["llm", "agent", "anthropic", "messages-api"]
categories = ["api-bindings", "web-programming::http-client"]
exclude.workspace = true

[package.metadata.plakous]
layer = "protocol"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 6
too-many-arguments-ceiling = 0
large-file-ceiling = 0
reason = "Existing item-local protocol debt; request-policy construction uses a typed input."

[dependencies]
base64.workspace = true
plakous-attempt.workspace = true
plakous-exchange.workspace = true
plakous-http.workspace = true
plakous-model.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor", "std"] }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }
tower-service.workspace = true
uuid.workspace = true

[lints]
workspace = true
