[package]
name = "plakous-responses"
description = "Responses-family protocol kernel primitives for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-responses"
readme = "README.md"
keywords = ["llm", "agent", "openai", "responses-api"]
categories = ["api-bindings", "web-programming::http-client"]
exclude.workspace = true

[package.metadata.plakous]
layer = "protocol"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 3
too-many-arguments-ceiling = 4
large-file-ceiling = 2
crate-wide-allows = ["src/lib.rs:too_many_arguments"]
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[dependencies]
plakous-http.workspace = true
plakous-model.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
