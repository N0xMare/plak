[package]
name = "plakous-responses-dialect"
description = "Generic Responses-family dialect host shapes (free functions + shared types)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "protocol"
class = "published-internal"

[dependencies]
base64.workspace = true
futures-core.workspace = true
plakous-attempt = { version = "0.1.0", path = "../../common/attempt" }
plakous-exchange = { version = "0.1.0", path = "../exchange" }
plakous-http = { version = "0.1.0", path = "../../common/http" }
plakous-model = { version = "0.1.0", path = "../../core/model" }
plakous-responses = { version = "0.1.0", path = "../responses" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }

[dev-dependencies]
plakous-http = { version = "0.1.0", path = "../../common/http", features = ["fault-injection"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
uuid.workspace = true

[lints]
workspace = true
