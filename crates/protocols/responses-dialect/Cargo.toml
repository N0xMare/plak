[package]
name = "plakous-responses-dialect"
description = "Generic Responses-family dialect host shapes (free functions + shared types)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-responses-dialect"
readme = "README.md"
keywords = ["llm", "agent", "responses-api", "streaming"]
categories = ["api-bindings", "web-programming::http-client"]
exclude.workspace = true

[package.metadata.plakous]
layer = "protocol"
class = "published-internal"

[dependencies]
base64.workspace = true
futures-core.workspace = true
plakous-attempt.workspace = true
plakous-exchange.workspace = true
plakous-http.workspace = true
plakous-model.workspace = true
plakous-responses.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
plakous-http = { workspace = true, features = ["fault-injection"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[lints]
workspace = true
