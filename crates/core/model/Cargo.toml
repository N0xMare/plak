[package]
name = "plakous-model"
description = "Provider-neutral inference contracts for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-model"
readme = "README.md"
keywords = ["llm", "agent", "inference", "provider"]
categories = ["development-tools", "asynchronous"]
exclude.workspace = true

[package.metadata.plakous]
layer = "core"
class = "supported"
neutral = true

[package.metadata.plakous-lint]
too-many-lines-ceiling = 13
too-many-arguments-ceiling = 17
large-file-ceiling = 0
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[features]
default = []

[dependencies]
base64.workspace = true
futures-core.workspace = true
futures-util = { workspace = true, features = ["std"] }
regex.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde", "v7"] }

# uuid 1.28 links getrandom for v7 on every target except this one, where it
# refuses to compile unless js, rng-getrandom, or rng-rand is on. js is its
# WebCrypto backend and is not enabled for native builds.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor", "std"] }
nix.workspace = true
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
