[package]
name = "plakous-model"
description = "Provider-neutral inference contracts for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-model"
readme = "README.md"
keywords = ["llm", "agent", "inference", "provider"]
categories = ["development-tools", "asynchronous"]
exclude.workspace = true
publish = false

[package.metadata.plakous]
layer = "core"
class = "supported"
neutral = true

[features]
default = []

[dependencies]
futures-core.workspace = true
futures-util = { workspace = true, features = ["std"] }
regex.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
futures = { workspace = true, features = ["executor", "std"] }
nix.workspace = true
proptest = { workspace = true, features = ["std"] }

[lints]
workspace = true
