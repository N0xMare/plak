[package]
name = "plakous-model-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "cargo-fuzz targets for the `plakous-model` response assembler, semantic JSON and portable schema."
license = "MIT"
repository = "https://github.com/N0xMare/plak"
readme = "../../../../README.md"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
plakous-model = { path = ".." }
serde_json = { version = "1", features = ["raw_value"] }

[[bin]]
name = "model_response_assembler"
path = "fuzz_targets/model_response_assembler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantic_json"
path = "fuzz_targets/semantic_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "portable_schema"
path = "fuzz_targets/portable_schema.rs"
test = false
doc = false
bench = false

[workspace]
