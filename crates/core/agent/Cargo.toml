[package]
name = "plakous-agent"
description = "Curated provider-neutral single-agent component for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-agent"
readme = "README.md"
keywords = ["llm", "agent", "agent-loop", "ai"]
categories = ["development-tools", "asynchronous"]
exclude.workspace = true

[package.metadata.plakous]
layer = "core"
class = "supported"
neutral = true

[features]
default = []

[dependencies]
futures-util = { workspace = true, features = ["std"] }
getrandom.workspace = true
plakous-model.workspace = true
plakous-tools.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
time = { version = "0.3", default-features = false, features = ["formatting"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
# Test-only: the composition presentations the agent hosts are compiled above
# it, so only its tests name them.
plakous-compose.workspace = true
plakous-tool-files.workspace = true
plakous-tool-plan.workspace = true
plakous-tool-process.workspace = true
plakous-tool-search.workspace = true
futures = { workspace = true, features = ["async-await", "executor", "std"] }
plakous-test-support = { path = "../../../tests/support/plakous-test-support" }
proptest = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
