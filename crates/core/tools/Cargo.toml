[package]
name = "plakous-tools"
description = "Portable tool contracts, registries, environments, and coding tools for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-tools"
readme = "README.md"
keywords = ["llm", "agent", "tool-calling", "tools"]
categories = ["development-tools", "asynchronous"]
exclude.workspace = true

[package.metadata.plakous]
layer = "core"
class = "supported"
neutral = true

[package.metadata.plakous-lint]
too-many-lines-ceiling = 17
too-many-arguments-ceiling = 17
large-file-ceiling = 1
reason = "Existing lint debt, and one large file (the joined-process registry) after the environment split; ratchet down as further splits land."

[features]
default = []

[dependencies]
filedescriptor.workspace = true
globset.workspace = true
ignore.workspace = true
plakous-model.workspace = true
portable-pty.workspace = true
regex.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
zeroize.workspace = true

[dev-dependencies]
nix.workspace = true
proptest = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
