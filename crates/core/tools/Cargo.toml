[package]
name = "plakous-tools"
description = "Portable tool contracts, registries, environments, and coding tools for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[package.metadata.plakous]
layer = "core"
class = "supported"
neutral = true

[features]
default = []

[dependencies]
filedescriptor.workspace = true
globset.workspace = true
ignore.workspace = true
plakous-model.workspace = true
portable-pty.workspace = true
regex.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
zeroize.workspace = true

[dev-dependencies]
nix.workspace = true
proptest = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
