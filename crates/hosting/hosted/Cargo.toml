[package]
name = "plakous-hosted"
description = "Hosted coding sessions, child execution, and product-supplied service ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-hosted"
readme = "README.md"
keywords = ["llm", "agent", "runtime"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "host"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 101
too-many-arguments-ceiling = 29
large-file-ceiling = 0
crate-wide-allows = []
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[dependencies]
plakous-host-protocol.workspace = true
plakous = { workspace = true, features = ["sessions-sqlite"] }
plakous-recursive-subagents.workspace = true
plakous-workspace.workspace = true
nix.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize.workspace = true
toml.workspace = true
time = { version = "0.3", features = ["formatting", "local-offset"] }
# Every attached image is decoded and, when over the bounds, downscaled and
# re-encoded (png, jpeg, gif first frame, webp) under `images`.
plakous-image.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
plakous-recursive-subagents-store = { workspace = true, features = ["test-support"], default-features = true }
plakous = { workspace = true, features = ["auth", "test-clock"] }
plakous-tools.workspace = true
plakous-host-protocol = { workspace = true, features = ["test-support"] }
plakous-recursive-subagents = { workspace = true, features = ["test-support"] }
plakous-workspace = { workspace = true, features = ["test-support"] }
plakous-anthropic.workspace = true
plakous-compose.workspace = true
plakous-chat-completions.workspace = true
plakous-messages.workspace = true
plakous-model.workspace = true
plakous-offline-crash-harness = { path = "../../../tests/harnesses/offline-crash" }
plakous-http.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
plakous-openai.workspace = true
plakous-openrouter = { workspace = true, features = ["test-clock"] }
plakous-responses.workspace = true
proptest = { workspace = true, features = ["std"] }
rusqlite.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
sha2.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[features]
codex = ["plakous/codex", "js"]
grok = ["plakous/grok"]
claude = ["plakous/claude"]
openai = ["plakous/openai", "js"]
xai-api = ["plakous/xai"]
anthropic = ["plakous/anthropic"]
openrouter = ["plakous/openrouter"]
default = ["git-cli", "jj-lib", "tui", "clipboard", "images", "js", "python", "mcp", "web-fetch", "codex", "grok", "claude", "openai", "xai-api", "anthropic", "openrouter"]
js = ["plakous/composition"]
web-fetch = ["plakous/web-fetch"]
tui = []
clipboard = ["tui", "images"]
images = ["plakous-image/normalize"]
python = ["js", "plakous/composition-python"]
mcp = ["plakous/mcp"]
git-cli = ["plakous-workspace/git-cli", "plakous-recursive-subagents/git-cli"]
jj-lib = ["plakous-workspace/jj-lib", "plakous-recursive-subagents/jj-lib"]
test-support = [
    "dep:tempfile",
    "plakous-recursive-subagents/test-support",
    "plakous-workspace/test-support",
]

[lints]
workspace = true
