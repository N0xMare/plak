[package]
name = "plakous-hosted"
description = "Hosted coding sessions, child execution, and product-supplied service ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "host"
class = "published-internal"

[dependencies]
plakous-host-protocol = { version = "0.1.0", path = "../host-protocol" }
plakous = { version = "0.1.0", path = "../../plakous", default-features = false, features = ["native-subscriptions", "mcp", "openai", "anthropic", "xai", "openrouter", "sessions-sqlite"] }
plakous-recursive-subagents = { version = "0.1.0", path = "../../orchestration/recursive-subagents", default-features = false }
plakous-workspace = { version = "0.1.0", path = "../../orchestration/workspace", default-features = false }
nix.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
time = { version = "0.3", features = ["formatting", "local-offset"] }
# Every attached image is decoded and, when over the bounds, downscaled and
# re-encoded (png, jpeg, gif first frame, webp).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
plakous-recursive-subagents-store = { version = "0.1.0", path = "../../orchestration/recursive-subagents-store", features = ["test-support"] }
plakous = { version = "0.1.0", path = "../../plakous", default-features = false, features = ["auth"] }
plakous-tools = { version = "0.1.0", path = "../../core/tools" }
plakous-host-protocol = { version = "0.1.0", path = "../host-protocol", features = ["test-support"] }
plakous-recursive-subagents = { version = "0.1.0", path = "../../orchestration/recursive-subagents", features = ["test-support"], default-features = false }
plakous-workspace = { version = "0.1.0", path = "../../orchestration/workspace", features = ["test-support"], default-features = false }
plakous-anthropic = { version = "0.1.0", path = "../../providers/anthropic" }
plakous-chat-completions = { version = "0.1.0", path = "../../protocols/chat-completions" }
plakous-messages = { version = "0.1.0", path = "../../protocols/messages" }
plakous-model = { version = "0.1.0", path = "../../core/model" }
plakous-offline-crash-harness = { version = "0.1.0", path = "../../../tests/harnesses/offline-crash" }
plakous-http = { version = "0.1.0", path = "../../common/http" }
plakous-openai = { version = "0.1.0", path = "../../providers/openai" }
plakous-openrouter = { version = "0.1.0", path = "../../providers/openrouter" }
plakous-responses-dialect = { version = "0.1.0", path = "../../protocols/responses-dialect" }
proptest = { workspace = true, features = ["std"] }
rusqlite.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
sha2.workspace = true
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[features]
default = ["git-cli", "jj-lib"]
git-cli = ["plakous-workspace/git-cli", "plakous-recursive-subagents/git-cli"]
jj-lib = ["plakous-workspace/jj-lib", "plakous-recursive-subagents/jj-lib"]
test-support = [
    "dep:tempfile",
    "plakous-recursive-subagents/test-support",
    "plakous-workspace/test-support",
]

[lints]
workspace = true
