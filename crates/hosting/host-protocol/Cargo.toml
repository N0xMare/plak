[package]
name = "plakous-host-protocol"
description = "Wire types for the plakd agent JSONL host protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/plakous-host-protocol"
readme = "README.md"
keywords = ["llm", "agent", "protocol"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "host"
class = "published-internal"
neutral = true

[dependencies]
base64.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
zeroize.workspace = true
# `JsonSchema` on every wire type: `plakd wire schema` emits the machine-readable
# wire v2 schema of the exact build.
schemars.workspace = true
uuid = { workspace = true, features = ["serde", "v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

[features]
default = []
test-support = []

[lints]
workspace = true
