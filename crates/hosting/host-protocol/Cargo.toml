[package]
name = "plakous-host-protocol"
description = "Wire types for the plak agent JSONL host protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-host-protocol"
readme = "README.md"
keywords = ["llm", "agent", "protocol"]
categories = ["development-tools"]
exclude.workspace = true

[package.metadata.plakous]
layer = "host"
class = "published-internal"
neutral = true

[package.metadata.plakous-lint]
too-many-lines-ceiling = 4
too-many-arguments-ceiling = 1
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

[features]
default = []
test-support = []

[lints]
workspace = true
