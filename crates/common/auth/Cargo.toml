[package]
name = "plakous-auth"
description = "Provider-neutral secure authentication foundations for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous-auth"
readme = "README.md"
keywords = ["llm", "agent", "oauth", "credentials"]
categories = ["authentication"]
exclude.workspace = true

[package.metadata.plakous]
layer = "common"
class = "published-internal"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 2
large-file-ceiling = 0
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[dependencies]
base64.workspace = true
getrandom.workspace = true
jsonwebtoken = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
plakous-http = { workspace = true, optional = true }
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = [
    "io-util",
    "net",
    "sync",
    "time",
] }
secrecy.workspace = true
url.workspace = true
zeroize.workspace = true

[features]
# external-compat removed from product path (owner lock 2026-08-04):
# plak-owned OAuth is the only supported login surface.
default = []
# Claimed refresh/revoke + browser loopback + JWKS cache orchestrators.
http-refresh = ["dep:plakous-http", "dep:tokio"]
# Content-free JWT rejection classification for signed-identity dialects.
jwt = ["http-refresh", "dep:jsonwebtoken", "dep:ring"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[lints]
workspace = true
