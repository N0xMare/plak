[package]
name = "plakous-http"
description = "Provider-blind bounded HTTP transport for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/plakous-http"
readme = "README.md"
keywords = ["llm", "agent", "http", "tls"]
categories = ["web-programming::http-client", "network-programming"]
exclude.workspace = true

[package.metadata.plakous]
layer = "common"
class = "published-internal"

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["std"] }
h2.workspace = true
plakous-gateway-protocol = { workspace = true, optional = true }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
webpki-roots.workspace = true
zeroize.workspace = true

[features]
# Repository-only transport fault injection driven by `PLAK_TEST_FAULTS`
# (spec 05). Reached from the product only through `plakd/test-hooks`; never in
# a default or release build.
fault-injection = ["tokio/io-util"]
# The credential gateway relay client: one upstream exchange per relay request
# over a Unix socket, a tailnet TCP address or an in-memory duplex (spec 01 §7.5).
gateway-client = ["dep:plakous-gateway-protocol", "tokio/io-util"]
# The provider-blind relay server core: envelope intake, frame streaming and
# the refusal envelope over one HTTP/1.1 connection, with credential injection
# supplied by the caller's custodian.
gateway-server = ["dep:plakous-gateway-protocol", "hyper/server", "tokio/io-util"]

[dev-dependencies]
hyper = { workspace = true, features = ["http2", "server"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[[test]]
name = "faults"
required-features = ["fault-injection"]

[lints]
workspace = true
