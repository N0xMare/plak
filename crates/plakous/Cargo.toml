[package]
name = "plakous"
description = "Provider-neutral, library-first agent harness library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous"
readme.workspace = true
keywords = ["llm", "agent", "ai", "harness", "embedding"]
categories = ["development-tools", "asynchronous"]
exclude.workspace = true

[package.metadata.plakous]
layer = "facade"
class = "supported"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 26
too-many-arguments-ceiling = 6
large-file-ceiling = 2
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[features]
test-clock = ["plakous-openai?/test-clock", "plakous-openrouter?/test-clock"]
default = []
# Provider protocol crates on the facade are provider internals (not TUI surface).
# Enabling openai/xai/openrouter/anthropic re-exports those crates as plakous::*.
# TUI/embedder-safe surface is always-on: agent (curated), model, tools, profiles.
# Provider-hosted tools and the local page fetcher are independent choices.
anthropic = ["dep:plakous-anthropic", "dep:plakous-http", "plakous-tool-web/image-gen"]
auth = ["dep:plakous-auth"]
web-fetch = ["plakous-tool-web/fetch", "dep:plakous-http"]
# Code Mode and JavaScript through the engine-free cell client; Python is
# selected explicitly by composition-python. Neither carries credential,
# subscription, or HTTP machinery.
composition = [
    "dep:thiserror",
    "dep:uuid",
    "dep:plakous-cell",
    "dep:serde",
    "dep:sha2",
]
composition-python = ["composition"]
full = [
    "anthropic",
    "auth",
    "composition",
    "composition-python",
    "mcp",
    "codex",
    "grok",
    "claude",
    "openai",
    "openrouter",
    "sessions-sqlite",
    "xai",
    "web-fetch",
]
# Model Context Protocol client: the server pool, frozen listings and the MCP
# tool pack. Configuration, secrets and views stay with the embedding product.
mcp = ["plakous-mcp/client"]
codex = ["dep:plakous-exchange", "dep:plakous-auth", "plakous-auth/http-refresh", "dep:plakous-http", "plakous-tool-web/image-gen", "dep:rustix", "dep:serde", "dep:uuid", "dep:plakous-openai", "plakous-openai/native-auth"]
grok = ["dep:plakous-exchange", "dep:plakous-auth", "plakous-auth/http-refresh", "dep:plakous-http", "plakous-tool-web/image-gen", "dep:rustix", "dep:serde", "dep:uuid", "dep:plakous-xai", "plakous-xai/native-auth", "dep:plakous-responses-dialect"]
claude = ["dep:plakous-exchange", "dep:plakous-auth", "plakous-auth/http-refresh", "dep:plakous-http", "plakous-tool-web/image-gen", "dep:rustix", "dep:serde", "dep:uuid", "dep:plakous-anthropic", "plakous-anthropic/native-auth"]
openai = ["dep:plakous-openai", "dep:plakous-http", "plakous-tool-web/image-gen"]
openrouter = ["dep:plakous-http", "dep:plakous-openrouter", "plakous-tool-web/image-gen"]
sessions-sqlite = ["plakous-store/sqlite"]
xai = ["dep:plakous-xai", "dep:plakous-http", "plakous-tool-web/image-gen"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
plakous-exchange = { workspace = true, optional = true }
plakous-responses-dialect = { workspace = true, optional = true }
plakous-agent.workspace = true
plakous-anthropic = { workspace = true, optional = true }
plakous-auth = { workspace = true, optional = true }
plakous-cell = { workspace = true, optional = true }
plakous-compose.workspace = true
plakous-mcp.workspace = true
plakous-model.workspace = true
plakous-tool-files.workspace = true
plakous-tool-plan.workspace = true
plakous-tool-process.workspace = true
plakous-tool-search.workspace = true
plakous-tool-web.workspace = true
plakous-prompts.workspace = true
plakous-openai = { workspace = true, optional = true }
plakous-openrouter = { workspace = true, optional = true }
plakous-store.workspace = true
plakous-http = { workspace = true, optional = true }
rustix = { workspace = true, features = ["fs", "process"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
plakous-tools.workspace = true
plakous-xai = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
futures-core.workspace = true
futures-util.workspace = true
plakous-anthropic = { workspace = true, features = ["test-clock"] }
plakous-openai = { workspace = true, features = ["test-support", "test-clock"] }
plakous-test-support = { path = "../../tests/support/plakous-test-support" }
plakous-xai = { workspace = true, features = ["test-clock"] }
rusqlite.workspace = true
rustix = { workspace = true, features = ["pty", "termios"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt-multi-thread", "test-util", "time"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

# Embedding examples. Each is a self-contained file an external consumer can
# copy; none depends on a repository test-support crate. `required-features`
# names exactly the facade capability the workflow needs.
[[example]]
name = "cancellation_shutdown"

[[example]]
name = "direct_custom_tool"
required-features = ["sessions-sqlite"]

[[example]]
name = "durable_session"
required-features = ["sessions-sqlite"]

[[example]]
name = "provider_direct"
required-features = ["openrouter"]

# The standard coding packs contain mutating tools, which require a
# required-durability session store; the composition example therefore also
# selects a session backend.
[[example]]
name = "worker_js_sidecar"
required-features = ["composition", "sessions-sqlite"]

[[bench]]
name = "perf_core"
harness = false

[[bench]]
name = "perf_project"
harness = false
