[package]
name = "plakous"
description = "Provider-neutral, library-first agent harness library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/plakous"
readme.workspace = true
keywords = ["llm", "agent", "ai", "harness", "embedding"]
categories = ["development-tools", "asynchronous"]
exclude.workspace = true
publish = false

[package.metadata.plakous]
layer = "facade"
class = "supported"

[features]
default = []
# Provider protocol crates on the facade are provider internals (not TUI surface).
# Enabling openai/xai/openrouter/anthropic re-exports those crates as plakous::*.
# TUI/embedder-safe surface is always-on: agent (curated), model, tools, profiles.
# Every feature that links plakous-http also builds the Plak-run `fetch_url`
# tool (`plakous-tool-web/fetch`) and the `image_gen` tool
# (`plakous-tool-web/image-gen`); composition-only closures stay HTTP-free.
anthropic = ["dep:plakous-anthropic", "dep:plakous-http", "plakous-tool-web/fetch", "plakous-tool-web/image-gen"]
auth = [
    "dep:plakous-auth",
    "openai",
    "xai",
]
# Code Mode presentation and JavaScript evaluation through the sidecar host.
# This is the whole evaluator capability a Custom-model JS embedder needs; it
# carries no credential, subscription, or HTTP machinery.
composition = [
    "dep:plakous-code-mode",
    "dep:plakous-js-eval",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
]
# The Monty-backed Python PTC projection, layered on the same composition API.
composition-python = ["composition", "dep:plakous-py-eval"]
full = [
    "anthropic",
    "auth",
    "composition",
    "composition-python",
    "mcp",
    "native-subscriptions",
    "openai",
    "openrouter",
    "sessions-sqlite",
    "xai",
]
# Model Context Protocol client: the server pool, frozen listings and the MCP
# tool pack. Configuration, secrets and views stay with the embedding product.
mcp = ["dep:plakous-mcp", "plakous-tool-web/fetch", "plakous-tool-web/image-gen"]
# Plak's product closure: both evaluators plus subscription authentication.
native-subscriptions = [
    "composition",
    "composition-python",
    "dep:plakous-auth",
    "plakous-auth/http-refresh",
    "dep:plakous-http",
    "plakous-tool-web/fetch",
    "plakous-tool-web/image-gen",
    "dep:rustix",
    "dep:plakous-openai",
    "plakous-openai/native-auth",
    "dep:plakous-xai",
    "plakous-xai/native-auth",
    "dep:plakous-anthropic",
    "plakous-anthropic/native-auth",
]
openai = ["dep:plakous-openai", "dep:plakous-http", "plakous-tool-web/fetch", "plakous-tool-web/image-gen"]
openrouter = ["dep:plakous-http", "dep:plakous-openrouter", "plakous-tool-web/fetch", "plakous-tool-web/image-gen"]
sessions-sqlite = ["plakous-store/sqlite"]
xai = ["dep:plakous-xai", "dep:plakous-http", "plakous-tool-web/fetch", "plakous-tool-web/image-gen"]

[dependencies]
plakous-agent.workspace = true
plakous-anthropic = { workspace = true, optional = true }
plakous-auth = { workspace = true, optional = true }
plakous-code-mode = { workspace = true, optional = true }
plakous-js-eval = { workspace = true, optional = true }
plakous-py-eval = { workspace = true, optional = true }
plakous-compose.workspace = true
plakous-mcp = { workspace = true, optional = true }
plakous-model.workspace = true
plakous-tool-files.workspace = true
plakous-tool-plan.workspace = true
plakous-tool-process.workspace = true
plakous-tool-search.workspace = true
plakous-tool-web.workspace = true
plakous-prompts.workspace = true
plakous-openai = { workspace = true, optional = true }
plakous-openrouter = { workspace = true, optional = true }
plakous-store.workspace = true
plakous-http = { workspace = true, optional = true }
rustix = { workspace = true, features = ["fs", "process"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
plakous-tools.workspace = true
plakous-xai = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
futures-core.workspace = true
futures-util.workspace = true
plakous-openai = { workspace = true, features = ["test-support"] }
plakous-test-support = { path = "../../tests/support/plakous-test-support" }
rusqlite.workspace = true
rustix = { workspace = true, features = ["pty", "termios"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

# Embedding examples. Each is a self-contained file an external consumer can
# copy; none depends on a repository test-support crate. `required-features`
# names exactly the facade capability the workflow needs.
[[example]]
name = "cancellation_shutdown"

[[example]]
name = "direct_custom_tool"
required-features = ["sessions-sqlite"]

[[example]]
name = "durable_session"
required-features = ["sessions-sqlite"]

[[example]]
name = "provider_direct"
required-features = ["openrouter"]

# The standard coding packs contain mutating tools, which require a
# required-durability session store; the composition example therefore also
# selects a session backend.
[[example]]
name = "worker_js_sidecar"
required-features = ["composition", "sessions-sqlite"]

[[bench]]
name = "perf_core"
harness = false

[[bench]]
name = "perf_project"
harness = false
