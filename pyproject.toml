# Tool configuration only. This file is not a Python project: do not add a
# project table. eval/ stays its own project (`uv run --project eval`).
[tool.ruff]
required-version = "==0.17.3"
target-version = "py311"
line-length = 100
extend-exclude = ["vendor", "eval/datasets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Sibling imports follow an explicit sys.path insert. Reordering them is not
# a formatting change, and the static path edit stays where the import needs it.
ignore = ["E402"]

[tool.ruff.format]
quote-style = "preserve"
