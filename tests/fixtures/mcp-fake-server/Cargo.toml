[package]
name = "plakous-mcp-fake-server"
description = "Scripted MCP server over stdio and streamable HTTP for the MCP client's offline tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "test"
class = "repository-only"

[[bin]]
name = "mcp-fake-server"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
plakous-http = { workspace = true, features = ["fault-injection"] }
plakous-mcp.workspace = true
plakous-model.workspace = true
plakous-tools.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
