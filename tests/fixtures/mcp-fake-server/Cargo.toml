[package]
name = "plakous-mcp-fake-server"
description = "Scripted MCP server over stdio for the MCP client's offline tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "test"
class = "repository-only"

[[bin]]
name = "mcp-fake-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
plakous-mcp = { version = "0.1.0", path = "../../../crates/harness/mcp" }
plakous-model = { version = "0.1.0", path = "../../../crates/core/model" }
plakous-tools = { version = "0.1.0", path = "../../../crates/core/tools" }
tempfile.workspace = true

[lints]
workspace = true
