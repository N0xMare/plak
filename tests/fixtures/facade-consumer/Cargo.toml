[package]
name = "plakous-facade-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "Compile fixture: an out-of-workspace consumer of the `plakous` facade with its provider features."
license = "MIT"
repository = "https://github.com/N0xMare/plak"
readme = "../../../README.md"
publish = false

[package.metadata.plakous]
layer = "test"
class = "repository-only"

[dependencies]
plakous = { version = "0.0.1", path = "../../../crates/plakous", features = ["anthropic", "auth", "native-subscriptions", "openai", "openrouter", "sessions-sqlite", "xai"] }

futures-util = "0.3.31"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = "1"

[workspace]
