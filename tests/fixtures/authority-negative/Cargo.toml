[package]
name = "plakous-authority-negative"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Compile fixture: negative pins proving private Plakous authority is unreachable from outside the workspace."
license = "MIT"
repository = "https://github.com/N0xMare/plak"
readme = "../../../README.md"
publish = false

[package.metadata.plakous]
layer = "test"
class = "repository-only"

[dependencies]
plakous = { version = "0.1.0", path = "../../../crates/plakous", features = ["full"] }
plakous-agent = { version = "0.1.0", path = "../../../crates/core/agent" }
plakous-tools = { version = "0.1.0", path = "../../../crates/core/tools" }

[[bin]]
name = "tools_internal_process_dispatch"
path = "src/bin/tools_internal_process_dispatch.rs"

[workspace]

[patch.crates-io]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
