[package]
name = "plakous-authority-negative"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
description = "Compile fixture: negative pins proving private Plakous authority is unreachable from outside the workspace."
license = "MIT"
repository = "https://github.com/N0xMare/plak"
readme = "../../../README.md"
publish = false

[package.metadata.plakous]
layer = "test"
class = "repository-only"

[dependencies]
plakous = { version = "0.0.2", path = "../../../crates/plakous", features = ["full"] }
plakous-agent = { version = "0.0.2", path = "../../../crates/core/agent" }
plakous-tools = { version = "0.0.2", path = "../../../crates/core/tools" }
plakous-hosted = { version = "0.0.2", path = "../../../crates/hosting/hosted", default-features = false }
plakous-host-protocol = { version = "0.0.2", path = "../../../crates/hosting/host-protocol" }

[[bin]]
name = "tools_internal_process_dispatch"
path = "src/bin/tools_internal_process_dispatch.rs"

[workspace]
