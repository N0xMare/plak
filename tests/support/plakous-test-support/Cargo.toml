[package]
name = "plakous-test-support"
description = "Unpublished deterministic fixtures and conformance helpers for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "test"
class = "repository-only"

[dependencies]
futures-core.workspace = true
futures-util = { workspace = true, features = ["std"] }
plakous-model.workspace = true
plakous-tools.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["async-await", "executor", "std"] }
proptest = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid.workspace = true

[lints]
workspace = true
