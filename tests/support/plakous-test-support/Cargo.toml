[package]
name = "plakous-test-support"
description = "Unpublished deterministic fixtures and conformance helpers for Plakous"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.plakous]
layer = "test"
class = "repository-only"

[package.metadata.plakous-lint]
too-many-lines-ceiling = 5
reason = "Existing lint and size debt, frozen at the counts on main; ratchet down as the splits land."

[dependencies]
futures-core.workspace = true
futures-util = { workspace = true, features = ["std"] }
plakous-auth = { workspace = true, features = ["http-refresh"] }
plakous-model.workspace = true
plakous-gateway-protocol.workspace = true
plakous-http = { workspace = true, features = ["fault-injection", "gateway-client", "gateway-server"] }
plakous-tools.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
# The shared custody conformance helpers pause Tokio time in consumers'
# unit tests; this dev-only dependency unifies their Tokio test-util feature.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[dev-dependencies]
futures = { workspace = true, features = ["async-await", "executor", "std"] }
proptest = { workspace = true, features = ["std"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid.workspace = true

[lints]
workspace = true
