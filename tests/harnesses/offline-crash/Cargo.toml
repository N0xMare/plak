[package]
name = "plakous-offline-crash-harness"
version.workspace = true
description = "Test harness: an out-of-process Plakous embedder killed mid-turn to exercise crash recovery."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[package.metadata.plakous]
layer = "test"
class = "repository-only"

[dependencies]
futures-util = { workspace = true, features = ["std"] }
# `composition`: the local-composition API the scripted Code Mode binding attaches.
plakous = { version = "0.1.0", path = "../../../crates/plakous", features = ["composition", "sessions-sqlite"] }
plakous-agent = { version = "0.1.0", path = "../../../crates/core/agent" }
plakous-model = { version = "0.1.0", path = "../../../crates/core/model" }
plakous-store = { version = "0.1.0", path = "../../../crates/store", features = ["commit-trace"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true, features = ["v4"] }

# The extra enrolled Code Mode target the scripted binding needs, taken
# unconditionally rather than behind a feature of this crate. This package is a
# repository-only harness: it is in a build only because something asked for it,
# so the enrolment cannot reach a default or release binary, and no feature edge
# has to cross a layer boundary to arrive.
plakous-compose = { version = "0.1.0", path = "../../../crates/harness/compose", features = [
    "scripted-code-mode-enrolment",
] }
# `PLAK_TEST_FAULTS` transport fault injection, for the same reason and in the
# same way: `plak/test-hooks` is the only product edge to this package.
plakous-http = { version = "0.1.0", path = "../../../crates/common/http", features = ["fault-injection"] }

[dev-dependencies]
# The route axis lowers one recovered canonical history through each real wire
# builder, so the reopen contract is proven carriable on every wire shape rather
# than on the one the harness happens to speak. This is why the abandonment note
# is spelled as User/Instruction: a shape every dialect can carry.
plakous-chat-completions = { version = "0.1.0", path = "../../../crates/protocols/chat-completions" }
plakous-messages = { version = "0.1.0", path = "../../../crates/protocols/messages" }
plakous-responses-dialect = { version = "0.1.0", path = "../../../crates/protocols/responses-dialect" }
tempfile.workspace = true

[lints]
workspace = true
