plakous-cell = { version = "0.0.3", path = "crates/runtimes/cell", default-features = false }
plakous-chat-completions = { version = "0.0.3", path = "crates/protocols/chat-completions", default-features = false }
plakous-compose = { version = "0.0.3", path = "crates/harness/compose", default-features = false }
plakous-exchange = { version = "0.0.3", path = "crates/protocols/exchange", default-features = false }
plakous-host-protocol = { version = "0.0.3", path = "crates/hosting/host-protocol", default-features = false }
plakous-hosted = { version = "0.0.3", path = "crates/hosting/hosted", default-features = false }
plakous-http = { version = "0.0.3", path = "crates/common/http", default-features = false }
plakous-mcp = { version = "0.0.3", path = "crates/harness/mcp", default-features = false }
plakous-messages = { version = "0.0.3", path = "crates/protocols/messages", default-features = false }
plakous-model = { version = "0.0.3", path = "crates/core/model", default-features = false }
plakous-openai = { version = "0.0.3", path = "crates/providers/openai", default-features = false }
plakous-openrouter = { version = "0.0.3", path = "crates/providers/openrouter", default-features = false }
plakous-prompts = { version = "0.0.3", path = "crates/harness/prompts", default-features = false }
plakous-recursive-subagents = { version = "0.0.3", path = "crates/orchestration/recursive-subagents", default-features = false }
plakous-recursive-subagents-store = { version = "0.0.3", path = "crates/orchestration/recursive-subagents-store", default-features = false }
plakous-responses = { version = "0.0.3", path = "crates/protocols/responses", default-features = false }
plakous-runner = { version = "0.0.3", path = "crates/runtimes/runner", default-features = false }
plakous-runner-protocol = { version = "0.0.3", path = "crates/common/runner-protocol", default-features = false }
plakous-store = { version = "0.0.3", path = "crates/store", default-features = false }
plakous-tool-files = { version = "0.0.3", path = "crates/harness/tool-files", default-features = false }
plakous-tool-plan = { version = "0.0.3", path = "crates/harness/tool-plan", default-features = false }
plakous-tool-process = { version = "0.0.3", path = "crates/harness/tool-process", default-features = false }
plakous-tool-search = { version = "0.0.3", path = "crates/harness/tool-search", default-features = false }
plakous-tool-web = { version = "0.0.3", path = "crates/harness/tool-web", default-features = false }
plakous-tools = { version = "0.0.3", path = "crates/core/tools", default-features = false }
plakous-workspace = { version = "0.0.3", path = "crates/orchestration/workspace", default-features = false }
