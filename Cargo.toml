]
may-use-ceiling = 53

[patch.crates-io]
monty-typeshed = { path = "vendor/monty-typeshed" }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "warn"
# `plak/test-hooks` is repository-only: the published `plak` manifest drops the
# feature (tools/release/publish_shape.py), and its cfg sites still name it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("test-hooks"))'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
duration_suboptimal_units = "allow"

# Line tables keep panics and backtraces pointing at source lines in workspace
# code; dependencies carry no debug info. Full debug info cost build and link
# time and tens of gigabytes of `target/debug` for no use in the gate.
# GNU host builds stay on the toolchain linker: the pinned toolchain's
# `gnu-lld-cc` flavor is unstable (spec 06 §6.4).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Build identity hashes the executable, including large debug binaries. Keep
# SHA-256's compression loop fast without optimizing workspace debug code.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

# Dogfood profile (`just build maintainer`, installed by `just install maintainer`):
# release codegen without LTO so rebuilds stay incremental, with line tables
# for panics and backtraces.
[profile.maintainer]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = "line-tables-only"
strip = "none"

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
lto = false

# Placement debt is capped at the current inventory; reductions must lower ceilings.

[workspace.metadata.plakous.cfg.plak]
feature-sites = ["src/lib.rs", "src/capabilities.rs"]
env-sites = ["src/environment.rs", "src/home/paths.rs", "src/home/secrets.rs", "src/commands/doctor.rs"]
feature-ceiling = 146
test-seam-ceiling = 76
env-ceiling = 26
reason = "Capability registry, grouped interactive identity/carry helpers, lookup/re-export predicates, the capacity-probe hook and the offline image-hash delay installed at the composition root; native contract-drift errors exist only with their compiled route."

[workspace.metadata.plakous.cfg.plakous]
feature-ceiling = 66
env-sites = ["src/test_session_lease.rs"]
reason = "Existing placement debt plus the auth/native-only drift type, error formatting and Codex live-refusal summaries; reduced products must not link omitted auth. The store feature gates the sessions module at its one declaration. The test-hooks session lease override is the only environment read, and other builds do not compile it."

[workspace.metadata.plakous.cfg.plakous-anthropic]
feature-ceiling = 22
reason = "Native beta classification and its HTTP hook stay feature-gated; shared API-key construction removes a native-only helper."

[workspace.metadata.plakous.cfg.plakous-auth]
feature-ceiling = 18
env-ceiling = 0
reason = "Existing placement debt; ratchet down as composition-root ports and module boundaries replace inline configuration."

[workspace.metadata.plakous.cfg.plakous-cell]
env-sites = ["src/test_hooks.rs"]
reason = "The test-hooks cell handshake override is the only environment read. Other builds do not compile that module."

[workspace.metadata.plakous.cfg.plakous-compose]
